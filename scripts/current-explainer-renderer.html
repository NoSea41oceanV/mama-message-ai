<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>おへんじ 現状説明動画</title><style>
body{margin:0;display:grid;place-items:center;min-height:100vh;background:#102637;font-family:"Yu Gothic UI","Meiryo",sans-serif}canvas{width:min(96vw,1280px);box-shadow:0 24px 80px #0008}button{margin:18px;padding:12px 28px;border:0;border-radius:999px;background:#ff6657;color:white;font-weight:800}
</style></head><body><main><canvas id="c" width="1280" height="720"></canvas><button id="start">動画を生成</button></main><script type="module">
window.addEventListener('unhandledrejection',event=>{document.title=`ERROR - ${event.reason?.message||event.reason}`});
const c=document.querySelector('#c'),x=c.getContext('2d'),scenes=await(await fetch('/scenes.json')).json();let total=0;
for(let i=0;i<scenes.length;i++){const s=scenes[i];s.start=total;s.end=total+s.duration;total=s.end;s.audio=await(await fetch(`/audio/scene-${String(i+1).padStart(2,'0')}.wav`)).arrayBuffer()}
const colors=['#36b8e8','#ff6657','#42c9b4','#8e74d7','#ffd23f','#198fd0','#f28a52','#36b8e8'];
function rr(a,b,w,h,r,fill,stroke){x.beginPath();x.roundRect(a,b,w,h,r);x.fillStyle=fill;x.fill();if(stroke){x.strokeStyle=stroke;x.lineWidth=2;x.stroke()}}
function wrap(t,n){const rows=[];let row='';for(const ch of t){row+=ch;if(row.length>=n){rows.push(row);row=''}}if(row)rows.push(row);return rows}
function draw(t){const s=scenes.find(q=>t>=q.start&&t<q.end)||scenes.at(-1),i=scenes.indexOf(s),accent=colors[i];x.fillStyle='#f7fbfd';x.fillRect(0,0,1280,720);x.fillStyle='#102f46';x.fillRect(0,0,1280,92);x.fillStyle=accent;x.fillRect(0,88,1280,6);x.fillStyle='#fff';x.font='800 19px Yu Gothic UI';x.fillText('AI HACK 2026  |  おへんじ',48,56);rr(1015,28,215,40,20,'#ffffff22');x.fillStyle='#fff';x.fillText(s.label,1042,55);x.fillStyle='#12314a';x.font='900 47px Yu Gothic UI';wrap(s.title,20).forEach((r,j)=>x.fillText(r,58,168+j*58));x.fillStyle='#607788';x.font='700 24px Yu Gothic UI';x.fillText(s.subtitle,60,244);x.fillStyle=accent;x.fillRect(60,276,116,7);s.bullets.forEach((b,j)=>{const y=334+j*72;rr(60,y-34,1160,56,9,'#fff','#d4e2e9');x.fillStyle=accent;x.beginPath();x.arc(92,y-6,12,0,Math.PI*2);x.fill();x.fillStyle='#18384d';x.font='700 23px Yu Gothic UI';x.fillText(b,125,y+2)});x.fillStyle='#102f46';x.font='600 17px Yu Gothic UI';x.fillText('現状説明  •  2026-08-14',60,665);x.fillStyle='#dbe7ec';x.fillRect(0,708,1280,12);x.fillStyle='#ff6657';x.fillRect(0,708,1280*Math.min(1,t/total),12)}draw(0);
document.querySelector('#start').onclick=async()=>{document.title='STAGE - audio';document.querySelector('#start').disabled=true;const ac=new AudioContext();await ac.resume();const dest=ac.createMediaStreamDestination(),cs=c.captureStream(30),stream=new MediaStream([...cs.getVideoTracks(),...dest.stream.getAudioTracks()]),mime=['video/webm;codecs=vp8,opus','video/webm'].find(candidate=>MediaRecorder.isTypeSupported(candidate)),rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:4500000,audioBitsPerSecond:160000}),chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);const stopped=new Promise(r=>rec.onstop=r),base=ac.currentTime+.4;for(const s of scenes){const src=ac.createBufferSource();src.buffer=await ac.decodeAudioData(s.audio.slice(0));src.connect(dest);src.start(base+s.start)}document.title='STAGE - recording';rec.start(1000);const began=performance.now();await new Promise(done=>{function f(now){const sec=(now-began)/1000;draw(sec);if(sec>=total)done();else requestAnimationFrame(f)}requestAnimationFrame(f)});document.title='STAGE - upload';rec.stop();await stopped;const video=new Blob(chunks,{type:rec.mimeType}),response=await fetch('/upload',{method:'POST',headers:{'content-type':video.type},body:video});if(!response.ok)throw new Error(await response.text());document.title='DONE - おへんじ 現状説明動画';await ac.close()};
</script></body></html>
